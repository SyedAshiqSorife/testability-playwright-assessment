name: E2E tests

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly regression against the live demo
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this tag/title (e.g. @positive)'
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The `setup` project (UI login, auth.setup.ts) always runs on Chromium,
      # so every job needs it in addition to the browser under test.
      - name: Install ${{ matrix.browser }} (+ chromium for auth setup)
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}

      - name: Run tests
        run: npx playwright test --project=${{ matrix.browser }} ${{ github.event.inputs.grep && format('--grep "{0}"', github.event.inputs.grep) || '' }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.browser }}
          path: reports/html
          retention-days: 14

      - name: Upload traces, screenshots and videos of failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.browser }}
          path: test-results
          retention-days: 14

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: reports/allure-results
          retention-days: 14

      - name: Publish JUnit summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/junit/results.xml
          check_name: JUnit (${{ matrix.browser }})
          annotate_only: true
          detailed_summary: true

  allure-report:
    name: Combined Allure report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Download Allure results from all browsers
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: reports/allure-results
          merge-multiple: true

      - name: Generate report
        run: npm run allure:generate

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
          retention-days: 30
