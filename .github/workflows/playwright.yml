name: E2E tests

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly regression against the live demo
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this tag/title (e.g. @positive)'
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Type-check, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: ${{ matrix.browser }}
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The `setup` project (UI login, auth.setup.ts) always runs on Chromium,
      # so every job needs it in addition to the browser under test.
      - name: Install ${{ matrix.browser }} (+ chromium for auth setup)
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}

      - name: Run tests
        run: npx playwright test --project=${{ matrix.browser }} ${{ github.event.inputs.grep && format('--grep "{0}"', github.event.inputs.grep) || '' }}

      - name: Upload HTML report (includes traces of failures)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.browser }}
          path: reports/html
          retention-days: 14

      - name: Upload traces, screenshots and videos of failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.browser }}
          path: test-results
          retention-days: 14

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: reports/allure-results
          retention-days: 14

      - name: Publish JUnit summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/junit/results.xml
          check_name: JUnit (${{ matrix.browser }})
          annotate_only: true
          detailed_summary: true

  reports:
    name: Build combined reports
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Download Allure results from all browsers
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: reports/allure-results
          merge-multiple: true

      - name: Download Playwright HTML reports
        uses: actions/download-artifact@v4
        with:
          pattern: html-report-*
          path: reports/html-reports

      - name: Generate Allure report
        run: npm run allure:generate

      # Site layout: / = combined Allure report, /playwright/<browser>/ = Playwright HTML report.
      - name: Assemble report site
        run: |
          mkdir -p site/playwright
          cp -r reports/allure-report/. site/
          for dir in reports/html-reports/html-report-*; do
            cp -r "$dir" "site/playwright/${dir##*/html-report-}"
          done

      - name: Upload combined reports
        uses: actions/upload-artifact@v4
        with:
          name: combined-reports
          path: site
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Requires: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
  deploy-reports:
    name: Publish reports to GitHub Pages
    needs: reports
    if: ${{ !cancelled() && needs.reports.result == 'success' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Link reports in the run summary
        run: |
          {
            echo "### Test reports"
            echo "- Allure (all browsers): ${{ steps.deployment.outputs.page_url }}"
            for b in chromium firefox webkit; do
              echo "- Playwright HTML ($b): ${{ steps.deployment.outputs.page_url }}playwright/$b/"
            done
          } >> "$GITHUB_STEP_SUMMARY"
